name: Build and publish IGDB PC catalogue

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amethys-igdb-catalog-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Generate and deploy the public catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zstandard encoder
        run: python -m pip install --disable-pip-version-check zstandard==0.25.0

      - name: Static checks for generator and SQLite schema
        run: |
          python -m py_compile scripts/build_igdb_catalog_db.py
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("scripts/catalog_schema.sql").read_text(encoding="utf-8"))
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert {row[0] for row in db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          )} >= {"games", "game_stores", "catalog_meta"}
          print("SQLite schema OK")
          PY

      - name: Build SQLite catalogue from IGDB
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python scripts/build_igdb_catalog_db.py

      - name: Verify generated catalogue manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("catalog-manifest.json").read_text(encoding="utf-8"))
          database = Path("catalog.db.zst")
          assert manifest["game_count"] > 0
          assert manifest["database"]["file"] == database.name
          assert manifest["database"]["compressed_size"] == database.stat().st_size
          assert manifest["database"]["compressed_sha256"] == hashlib.sha256(database.read_bytes()).hexdigest()
          print(f"Catalogue ready: {manifest['game_count']} Windows PC games")
          PY

      - name: Persist stable Amethys ID registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/amethys-id-registry.json
          if git diff --cached --quiet; then
            echo "ID registry is unchanged."
          else
            git commit -m "Update stable Amethys catalogue ID registry"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public catalogue site
        run: |
          mkdir -p public
          cp catalog.db.zst catalog-manifest.json public/
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Amethys Game Catalogue</title></head>
            <body>
              <h1>Amethys Game Catalogue</h1>
              <p>This endpoint distributes the public Windows PC master catalogue.</p>
              <p><a href="./catalog-manifest.json">Catalogue manifest</a></p>
              <p><a href="./catalog.db.zst">Compressed SQLite database</a></p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy catalogue to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
