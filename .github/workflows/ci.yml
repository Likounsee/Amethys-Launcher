name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Smoke-test CLI package commands
        run: |
          cargo run --release -p amethys-cli --bin amethysctl -- --version
          cargo run --release -p amethys-cli --bin amethysctl -- --help

      - name: Smoke-test Windows agent and CLI IPC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP ("amethys-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:AMETHYS_DATA_DIR = $dataDir
          $agent = Start-Process -FilePath "$PWD/target/release/amethys-agent.exe" -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($agent.HasExited) { throw "Amethys agent exited during startup (code $($agent.ExitCode))." }
              & "$PWD/target/release/amethysctl.exe" ping *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Amethys agent did not become ready within 30 seconds." }
            & "$PWD/target/release/amethysctl.exe" status
            if ($LASTEXITCODE -ne 0) { throw "CLI status request failed." }
            & "$PWD/target/release/amethysctl.exe" games
            if ($LASTEXITCODE -ne 0) { throw "CLI game-list request failed." }
            & "$PWD/target/release/amethysctl.exe" games verify
            if ($LASTEXITCODE -ne 0) { throw "CLI game verification failed for an empty library." }
            $verify = & "$PWD/target/release/amethysctl.exe" games verify --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $verify.schema_version -ne 3 -or $verify.read_only -ne $true -or $verify.total_games -ne 0 -or $verify.issues -ne 0 -or $verify.launch_ready -ne 0) {
              throw "CLI JSON verification did not return the expected empty read-only schema."
            }
            $scan = & "$PWD/target/release/amethysctl.exe" games scan --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $scan.schema_version -ne 1 -or $scan.read_only -ne $true) {
              throw "CLI JSON scan did not return the expected read-only schema."
            }

            $installDir = Join-Path $dataDir "Smoke Game"
            New-Item -ItemType Directory -Force (Join-Path $installDir "bin") | Out-Null
            Set-Content -Path (Join-Path $installDir "bin/game.exe") -Value "smoke"
            $addOutput = & "$PWD/target/release/amethysctl.exe" games add "Smoke Game" "CI" $installDir
            if ($LASTEXITCODE -ne 0) { throw "CLI game add failed." }
            if ($addOutput -notmatch 'identifiant : ([^)]+)') { throw "CLI game add did not return a game ID." }
            $gameId = $Matches[1]
            $unconfiguredVerify = & "$PWD/target/release/amethysctl.exe" games verify --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $unconfiguredVerify.healthy -ne 1 -or $unconfiguredVerify.launch_ready -ne 0 -or $unconfiguredVerify.games[0].launch_ready -ne $false) {
              throw "CLI verification did not distinguish a healthy unconfigured game from a launch-ready game."
            }
            & "$PWD/target/release/amethysctl.exe" games set-executable $gameId "bin/game.exe"
            if ($LASTEXITCODE -ne 0) { throw "CLI executable configuration failed." }

            # Exercise the launcher's security boundary through the real IPC/CLI path.
            & "$PWD/target/release/amethysctl.exe" games set-executable $gameId "../outside.exe"
            if ($LASTEXITCODE -ne 0) { throw "CLI rejected executable metadata before the launch safety check." }
            & "$PWD/target/release/amethysctl.exe" games launch $gameId *> $null
            if ($LASTEXITCODE -eq 0) { throw "CLI launched an executable outside the registered installation." }

            # Use the CLI itself as a harmless, short-lived executable to test a real process launch.
            $launchExecutable = Join-Path $installDir "bin/launch-smoke.exe"
            Copy-Item "$PWD/target/release/amethysctl.exe" $launchExecutable
            & "$PWD/target/release/amethysctl.exe" games set-executable $gameId "bin/launch-smoke.exe"
            if ($LASTEXITCODE -ne 0) { throw "CLI could not configure the in-installation launch fixture." }
            & "$PWD/target/release/amethysctl.exe" games launch $gameId
            if ($LASTEXITCODE -ne 0) { throw "CLI failed to launch an executable inside the registered installation." }

            $search = & "$PWD/target/release/amethysctl.exe" games search "smoke game"
            if ($LASTEXITCODE -ne 0 -or ($search -join " ") -notmatch "Smoke Game") { throw "CLI game search failed." }
            & "$PWD/target/release/amethysctl.exe" games list --platform CI
            if ($LASTEXITCODE -ne 0) { throw "CLI platform-filtered game list failed." }
            $populatedVerify = & "$PWD/target/release/amethysctl.exe" games verify --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $populatedVerify.total_games -ne 1 -or $populatedVerify.healthy -ne 1 -or $populatedVerify.games[0].executable_status -ne "available" -or $populatedVerify.launch_ready -ne 1 -or $populatedVerify.games[0].launch_ready -ne $true) {
              throw "CLI verification did not recognize the healthy smoke-test installation."
            }
            & "$PWD/target/release/amethysctl.exe" games remove $gameId
            if ($LASTEXITCODE -ne 0) { throw "CLI game removal failed." }
            $finalVerify = & "$PWD/target/release/amethysctl.exe" games verify --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $finalVerify.total_games -ne 0) { throw "CLI game removal did not clear the library." }
          }
          finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
            Wait-Process -Id $agent.Id -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test Linux agent and CLI IPC
        if: runner.os == 'Linux'
        shell: bash
        run: |
          data_dir="$(mktemp -d)"
          export AMETHYS_DATA_DIR="$data_dir"
          target/release/amethys-agent &
          agent_pid=$!
          cleanup() {
            kill "$agent_pid" 2>/dev/null || true
            wait "$agent_pid" 2>/dev/null || true
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              echo "Amethys agent exited during startup."
              exit 1
            fi
            if target/release/amethysctl ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Amethys agent did not become ready within 30 seconds."
            exit 1
          fi
          target/release/amethysctl status
          target/release/amethysctl games
          target/release/amethysctl games verify
          verify_json="$(target/release/amethysctl games verify --json)"
          printf '%s' "$verify_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"] == 3 and d["read_only"] is True and d["total_games"] == 0 and d["issues"] == 0 and d["launch_ready"] == 0'
          scan_json="$(target/release/amethysctl games scan --json)"
          printf '%s' "$scan_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"] == 1 and d["read_only"] is True'

          install_dir="$data_dir/Smoke Game"
          mkdir -p "$install_dir/bin"
          printf 'smoke' > "$install_dir/bin/game"
          add_output="$(target/release/amethysctl games add "Smoke Game" CI "$install_dir")"
          game_id="$(printf '%s' "$add_output" | sed -n 's/.*identifiant : \([^)]*\).*/\1/p')"
          if [ -z "$game_id" ]; then echo "CLI game add did not return a game ID."; exit 1; fi
          unconfigured_verify="$(target/release/amethysctl games verify --json)"
          printf '%s' "$unconfigured_verify" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["healthy"] == 1 and d["launch_ready"] == 0 and d["games"][0]["launch_ready"] is False'
          target/release/amethysctl games set-executable "$game_id" bin/game

          # Exercise the launcher's security boundary through the real IPC/CLI path.
          target/release/amethysctl games set-executable "$game_id" ../outside
          if target/release/amethysctl games launch "$game_id"; then
            echo "CLI launched an executable outside the registered installation."
            exit 1
          fi

          # Use the CLI itself as a harmless, short-lived executable to test a real process launch.
          cp target/release/amethysctl "$install_dir/bin/launch-smoke"
          chmod +x "$install_dir/bin/launch-smoke"
          target/release/amethysctl games set-executable "$game_id" bin/launch-smoke
          target/release/amethysctl games launch "$game_id"

          search_output="$(target/release/amethysctl games search "smoke game")"
          printf '%s' "$search_output" | grep -q "Smoke Game"
          target/release/amethysctl games list --platform CI
          populated_verify="$(target/release/amethysctl games verify --json)"
          printf '%s' "$populated_verify" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_games"] == 1 and d["healthy"] == 1 and d["games"][0]["executable_status"] == "available" and d["launch_ready"] == 1 and d["games"][0]["launch_ready"] is True'
          target/release/amethysctl games remove "$game_id"
          final_verify="$(target/release/amethysctl games verify --json)"
          printf '%s' "$final_verify" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_games"] == 0'
      - name: Smoke-test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/amethys-agent.exe,target/release/amethysctl.exe,README.md,LICENSE,doc/technical/RELEASES.md -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath amethys-ci-windows.zip
          Expand-Archive -Path amethys-ci-windows.zip -DestinationPath archive-check
          $expected = @("amethys-agent.exe", "amethysctl.exe", "README.md", "LICENSE", "RELEASES.md")
          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path archive-check $file) -PathType Leaf)) {
              throw "Windows release archive is missing $file."
            }
          }
          if ((Get-ChildItem archive-check -File).Count -ne $expected.Count) {
            throw "Windows release archive contains unexpected files."
          }
          foreach ($binary in @("amethys-agent.exe", "amethysctl.exe")) {
            if ((Get-Item (Join-Path archive-check $binary)).Length -le 0) {
              throw "Windows release archive contains an empty binary: $binary."
            }
          }
          $cli = Join-Path (Resolve-Path archive-check).Path "amethysctl.exe"
          $versionOutput = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^Amethys Launcher [0-9]+[.][0-9]+[.][0-9]+$') {
            throw "Packaged Windows CLI version smoke test failed: $versionOutput"
          }
          $helpOutput = & $cli --help
          if ($LASTEXITCODE -ne 0 -or ($helpOutput -join "`n") -notmatch "games scan") {
            throw "Packaged Windows CLI help smoke test failed."
          }

          # Exercise the agent and CLI from the extracted archive, not only the build directory.
          $dataDir = Join-Path $env:RUNNER_TEMP ("amethys-archive-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:AMETHYS_DATA_DIR = $dataDir
          $agentPath = Join-Path (Resolve-Path archive-check).Path "amethys-agent.exe"
          $agent = Start-Process -FilePath $agentPath -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($agent.HasExited) { throw "Packaged Windows agent exited during startup (code $($agent.ExitCode))." }
              & $cli ping *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Packaged Windows agent did not become ready within 30 seconds." }
            & $cli status
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows agent status request failed." }
          }
          finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
            Wait-Process -Id $agent.Id -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/amethys-agent target/release/amethysctl README.md LICENSE doc/technical/RELEASES.md dist/
          tar -czf amethys-ci-linux.tar.gz -C dist amethys-agent amethysctl README.md LICENSE RELEASES.md
          tar -tzf amethys-ci-linux.tar.gz | sort > archive-contents.txt
          printf '%s\n' LICENSE README.md RELEASES.md amethys-agent amethysctl | sort > expected-contents.txt
          diff -u expected-contents.txt archive-contents.txt
          mkdir archive-check
          tar -xzf amethys-ci-linux.tar.gz -C archive-check
          test -s archive-check/amethys-agent
          test -s archive-check/amethysctl
          test -x archive-check/amethys-agent
          test -x archive-check/amethysctl
          archive-check/amethysctl --version | grep -Eq '^Amethys Launcher [0-9]+[.][0-9]+[.][0-9]+'

          archive-check/amethysctl --help | grep -Fq "games scan"

          # Exercise the agent and CLI from the extracted archive, not only the build directory.
          data_dir="$(mktemp -d)"
          export AMETHYS_DATA_DIR="$data_dir"
          archive-check/amethys-agent &
          agent_pid=$!
          cleanup() {
            kill "$agent_pid" 2>/dev/null || true
            wait "$agent_pid" 2>/dev/null || true
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              echo "Packaged Linux agent exited during startup."
              exit 1
            fi
            if archive-check/amethysctl ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Packaged Linux agent did not become ready within 30 seconds."
            exit 1
          fi
          archive-check/amethysctl status

  desktop-linux-unit-tests:
    name: Desktop library tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amethys Launcher
        uses: actions/checkout@v4
        with:
          path: Amethys-Launcher
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run desktop library and filesystem-safety tests
        working-directory: Amethys-Launcher
        run: cargo test --no-default-features --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml --lib

  desktop-integration:
    name: GhostEngine desktop integration
    runs-on: windows-latest
    steps:
      - name: Checkout Amethys Launcher
        uses: actions/checkout@v4
        with:
          path: Amethys-Launcher
      - name: Checkout experimental GhostEngine
        uses: actions/checkout@v4
        with:
          repository: Likounsee/GhostEngine
          ref: GhostEngine
          path: GhostEngine
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check the desktop application against the current engine prototype
        working-directory: Amethys-Launcher
        run: |
          cargo check --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Desktop integration check failed." }
          cargo test --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw "Desktop integration unit tests failed." }
      - name: Build and smoke-test the portable Windows desktop package
        working-directory: Amethys-Launcher
        shell: pwsh
        run: |
          & scripts/package-desktop-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop packaging failed." }

          # Verify every staged file and the final archive against their SHA-256 records.
          $packageRoot = Join-Path $PWD "dist/Amethys"
          $manifestPath = Join-Path $packageRoot "SHA256SUMS.txt"
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw "Portable package is missing SHA256SUMS.txt." }
          foreach ($line in Get-Content -LiteralPath $manifestPath) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw "Malformed portable package checksum entry: $line" }
            $filePath = Join-Path $packageRoot $parts[1]
            if (-not (Test-Path $filePath -PathType Leaf)) { throw "Checksum manifest references a missing file: $($parts[1])" }
            $actualHash = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $parts[0]) { throw "Portable package checksum mismatch: $($parts[1])" }
          }
          $archivePath = Join-Path $PWD "dist/Amethys-Windows-x64.zip"
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $declaredArchiveHash = ((Get-Content -LiteralPath "$archivePath.sha256" -Raw).Trim() -split '\s+', 2)[0]
          if ($archiveHash -ne $declaredArchiveHash) { throw "Windows portable archive SHA-256 verification failed." }

          $app = Join-Path $PWD "dist/Amethys/amethys-launcher.exe"
          $cli = Join-Path $PWD "dist/Amethys/amethysctl.exe"
          if (-not (Test-Path $cli -PathType Leaf)) { throw "Portable desktop package is missing amethysctl.exe." }
          & $cli --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Packaged amethysctl.exe failed its help smoke test." }
          $snapshot = Join-Path $env:RUNNER_TEMP "amethys-desktop-smoke"
          $env:AMETHYS_DATA_DIR = Join-Path $env:RUNNER_TEMP ("amethys-desktop-data-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $snapshot | Out-Null
          $arguments = '--snapshot "' + $snapshot + '"'
          $desktop = Start-Process -FilePath $app -ArgumentList $arguments -PassThru
          if (-not $desktop.WaitForExit(120000)) {
            Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged desktop snapshot did not exit within 120 seconds."
          }
          $desktop.Refresh()
          if ($desktop.ExitCode -ne 0) { throw "Packaged desktop application smoke test failed with exit code $($desktop.ExitCode)." }
          $firstShot = Join-Path $snapshot "01-bibliotheque.png"
          if (-not (Test-Path $firstShot -PathType Leaf)) {
            $diagnostic = Join-Path $snapshot "snapshot-error.txt"
            if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Error }
            throw "Packaged desktop application did not produce its headless smoke-test image."
          }
          $settingsShot = Join-Path $snapshot "18-parametres.png"
          if (-not (Test-Path $settingsShot -PathType Leaf)) {
            throw "Desktop snapshot did not reach or capture the settings page."
          }
