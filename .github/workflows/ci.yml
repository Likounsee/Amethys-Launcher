name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Smoke-test CLI package commands
        run: |
          cargo run --release -p amethys-cli --bin amethysctl -- --version
          cargo run --release -p amethys-cli --bin amethysctl -- --help

      - name: Smoke-test Windows agent and CLI IPC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP ("amethys-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:AMETHYS_DATA_DIR = $dataDir
          $agent = Start-Process -FilePath "$PWD/target/release/amethys-agent.exe" -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($agent.HasExited) { throw "Amethys agent exited during startup (code $($agent.ExitCode))." }
              & "$PWD/target/release/amethysctl.exe" ping *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Amethys agent did not become ready within 30 seconds." }
            & "$PWD/target/release/amethysctl.exe" status
            if ($LASTEXITCODE -ne 0) { throw "CLI status request failed." }
            & "$PWD/target/release/amethysctl.exe" games
            if ($LASTEXITCODE -ne 0) { throw "CLI game-list request failed." }
            & "$PWD/target/release/amethysctl.exe" games verify
            if ($LASTEXITCODE -ne 0) { throw "CLI game verification failed for an empty library." }
            $scan = & "$PWD/target/release/amethysctl.exe" games scan --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $scan.schema_version -ne 1 -or $scan.read_only -ne $true) {
              throw "CLI JSON scan did not return the expected read-only schema."
            }
          }
          finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
            Wait-Process -Id $agent.Id -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test Linux agent and CLI IPC
        if: runner.os == 'Linux'
        shell: bash
        run: |
          data_dir="$(mktemp -d)"
          export AMETHYS_DATA_DIR="$data_dir"
          target/release/amethys-agent &
          agent_pid=$!
          cleanup() {
            kill "$agent_pid" 2>/dev/null || true
            wait "$agent_pid" 2>/dev/null || true
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              echo "Amethys agent exited during startup."
              exit 1
            fi
            if target/release/amethysctl ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Amethys agent did not become ready within 30 seconds."
            exit 1
          fi
          target/release/amethysctl status
          target/release/amethysctl games
          target/release/amethysctl games verify
          scan_json="$(target/release/amethysctl games scan --json)"
          printf '%s' "$scan_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"] == 1 and d["read_only"] is True'
      - name: Smoke-test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/amethys-agent.exe,target/release/amethysctl.exe,README.md,LICENSE,doc/technical/RELEASES.md -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath amethys-ci-windows.zip
          Expand-Archive -Path amethys-ci-windows.zip -DestinationPath archive-check
          $expected = @("amethys-agent.exe", "amethysctl.exe", "README.md", "LICENSE", "RELEASES.md")
          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path archive-check $file) -PathType Leaf)) {
              throw "Windows release archive is missing $file."
            }
          }
          if ((Get-ChildItem archive-check -File).Count -ne $expected.Count) {
            throw "Windows release archive contains unexpected files."
          }
      - name: Smoke-test Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/amethys-agent target/release/amethysctl README.md LICENSE doc/technical/RELEASES.md dist/
          tar -czf amethys-ci-linux.tar.gz -C dist amethys-agent amethysctl README.md LICENSE RELEASES.md
          tar -tzf amethys-ci-linux.tar.gz | sort > archive-contents.txt
          printf '%s\n' LICENSE README.md RELEASES.md amethys-agent amethysctl | sort > expected-contents.txt
          diff -u expected-contents.txt archive-contents.txt
