name: Windows desktop preview

'on':
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'prototypes/ghostengine-amethys-preview/**'
      - 'vendor/ghostengine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/preview-windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and package Windows x64 preview
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test Core workspace
        run: cargo test --workspace --all-targets

      - name: Check desktop launcher
        run: cargo clippy --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml --all-targets -- -D warnings

      - name: Test desktop launcher
        run: cargo test --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml --all-targets

      - name: Build Core and CLI
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Build graphical launcher
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path prototypes/ghostengine-amethys-preview/Cargo.toml --bin amethys-launcher

      - name: Assemble portable preview
        shell: pwsh
        run: |
          $stage = "dist/Amethys"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/amethys-agent.exe,target/x86_64-pc-windows-msvc/release/amethysctl.exe,target/x86_64-pc-windows-msvc/release/amethys-launcher.exe -Destination $stage
          New-Item -ItemType Directory -Force "$stage/assets" | Out-Null
          Copy-Item prototypes/ghostengine-amethys-preview/assets/fonts "$stage/assets/" -Recurse
          Copy-Item prototypes/ghostengine-amethys-preview/assets/covers "$stage/assets/" -Recurse
          Copy-Item README.md,LICENSE,doc/technical/RELEASES.md -Destination $stage
          @'
          Amethys Launcher — Windows x64 development preview

          Run amethys-launcher.exe to open the graphical launcher.
          The local Amethys agent starts automatically when required.
          Use amethysctl.exe --help for command-line tools.
          Keep the assets directory beside the executables.
          This is a portable development build, not an installer or stable release.
          '@ | Set-Content -Encoding UTF8 "$stage/LIRE-MOI.txt"

          $required = @("amethys-agent.exe", "amethysctl.exe", "amethys-launcher.exe", "README.md", "LICENSE", "RELEASES.md", "LIRE-MOI.txt", "assets/fonts", "assets/covers")
          foreach ($entry in $required) {
            if (-not (Test-Path (Join-Path $stage $entry))) { throw "Preview package is missing $entry." }
          }
          foreach ($binary in @("amethys-agent.exe", "amethysctl.exe", "amethys-launcher.exe")) {
            if ((Get-Item (Join-Path $stage $binary)).Length -le 0) { throw "Empty executable: $binary" }
          }
          $version = & "$stage/amethysctl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI version check failed." }
          Compress-Archive -Path "$stage/*" -DestinationPath "Amethys-Windows-x64-preview.zip" -CompressionLevel Optimal

          $check = "archive-check"
          Expand-Archive "Amethys-Windows-x64-preview.zip" $check
          foreach ($entry in $required) {
            if (-not (Test-Path (Join-Path $check $entry))) { throw "Archive is missing $entry." }
          }

          # Smoke-test the packaged agent and CLI from the extracted archive.
          $cli = Join-Path (Resolve-Path $check).Path "amethysctl.exe"
          $version = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Amethys Launcher ') {
            throw "Packaged CLI version smoke test failed: $version"
          }
          $help = & $cli --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch "games scan") {
            throw "Packaged CLI help smoke test failed."
          }

          $dataDir = Join-Path $env:RUNNER_TEMP ("amethys-preview-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:AMETHYS_DATA_DIR = $dataDir
          $agentPath = Join-Path (Resolve-Path $check).Path "amethys-agent.exe"
          $agent = Start-Process -FilePath $agentPath -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($agent.HasExited) { throw "Packaged agent exited during startup (code $($agent.ExitCode))." }
              & $cli ping *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Packaged agent did not become ready within 30 seconds." }
            & $cli status
            if ($LASTEXITCODE -ne 0) { throw "Packaged agent status request failed." }
          }
          finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
            Wait-Process -Id $agent.Id -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload testable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Amethys-Windows-x64-preview
          path: Amethys-Windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
