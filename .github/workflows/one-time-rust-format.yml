name: One-time Rust formatting repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-rust-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the complete workspace
        run: cargo fmt --all
      - name: Commit formatting corrections
        run: |
          if git diff --quiet; then
            echo "Rust workspace is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Format Rust workspace"
          git push origin HEAD:main
