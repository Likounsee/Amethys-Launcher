name: Import IGDB master catalogue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igdb-master-catalogue
  cancel-in-progress: false

jobs:
  import:
    name: Refresh master game catalogue from IGDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import PC games from IGDB
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python scripts/import_igdb_catalog.py
      - name: Validate generated JSON and stable identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("catalogs/master-games-v1.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("catalogs/amethys-id-registry.json").read_text(encoding="utf-8"))
          games = catalog["games"]
          ids = [game["amethys_id"] for game in games]
          assert all(isinstance(value, int) and value > 0 for value in ids)
          assert len(ids) == len(set(ids)), "duplicate Amethys IDs"
          assert len({game["id"] for game in games}) == len(games), "duplicate IGDB game keys"
          external = [
              (offer["provider_id"], offer["external_id"])
              for game in games for offer in game["offers"]
          ]
          assert len(external) == len(set(external)), "duplicate platform identities"
          assert set(ids).issubset(set(registry["retired_or_known_ids"]))
          print(f"Validated {len(games)} games and {len(external)} platform identities.")
          PY
      - name: Commit refreshed catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogs/master-games-v1.json catalogs/amethys-id-registry.json
          if git diff --cached --quiet; then
            echo "Catalogue is unchanged."
            exit 0
          fi
          git commit -m "Refresh master game catalogue from IGDB"
          git push origin HEAD:main
