[workspace]
resolver = "2"
members = ["apps/agent", "apps/cli", "crates/amethys-discovery", "crates/amethys-config", "crates/amethys-errors", "crates/amethys-events", "crates/amethys-ipc", "crates/amethys-logging", "crates/amethys-orchestration", "crates/amethys-runtime", "crates/amethys-storage", "crates/amethys-media"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
amethys-config = { path = "crates/amethys-config" }
amethys-errors = { path = "crates/amethys-errors" }
amethys-events = { path = "crates/amethys-events" }
amethys-ipc = { path = "crates/amethys-ipc" }
amethys-logging = { path = "crates/amethys-logging" }
amethys-runtime = { path = "crates/amethys-runtime" }
amethys-storage = { path = "crates/amethys-storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
